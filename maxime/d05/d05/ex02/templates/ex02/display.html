<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Ex02</title>
	</head>
	<body>
		<table style="border-spacing: 0;border-collapse: collapse">
		{% for item in data %}
			<tr>
				{% for var in item %}
				<td style="border: 1px solid orange;padding: 5px">
					<p>{{ var }}</p>
				</td>
				{% endfor %}
			</tr>
		{% endfor %}
		</table>
	</body>
</html>
