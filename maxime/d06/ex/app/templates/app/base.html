<!doctype html>
<html>
<head>
    <title>Life Pro Tips</title>
	<meta charset="utf-8">
	<style>
	.nav-e {
		display: inline-block;
		padding: 20px;
	}
	label {
		display: block;
	}
	</style>
</head>
<body>
<nav style="border-bottom: 2px solid black">
	<a href="/" class="nav-e">Life Pro Tips</a>
	{% if user.is_authenticated %}
		<div class="nav-e">Hello {{ user.username }}!</div>
	{% else %}
		<div class="nav-e">Hello {{ request.COOKIES.anon_auth }}!</div>
	{% endif %}
	<div style="float:right;">
		{% if user.is_authenticated %}
			<a href="/logout" class="nav-e">Logout</a>
		{% else %}
			<a href="/login" class="nav-e">Login</a>
			<a href="/register" class="nav-e">Register</a>
		{% endif %}
	</div>
</nav>
{% block body %}
{{ request.COOKIES }}
{% endblock %}
</body>
</html>
