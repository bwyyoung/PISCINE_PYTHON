<!DOCTYPE html>
<head>
	<meta charset="utf-8" />
	<title>CV HTML</title>
	<style>
		*
		{
			line-height: 40px;
			box-sizing: border-box;
		}
		html, body
		{
			height: 100%;
		}
		body
		{
			margin: 0;
			padding: 0;
			font-family: helvetica, arial, serif;
			color: white;
		}
		.container
		{
			display: flex;
			flex-direction: column;
			height: 100%;
		}
		table, td, th
		{
			border: solid;
			border-collapse: collapse;
		}
		footer
		{
			display: flex;
			background-color: #3399FF;
			height: 70px;
			width: 100%;
		}
		header
		{
			display: flex;
			background-color: tomato;
			height: 150px;
			width: 100%;
		}
		.main
		{
			display: flex;
			flex-direction: column;
			padding: 20px;
			background-color: darkgray;			
			height: calc(100% - 220px);
		}
		.no-border-bottom
		{
			border-bottom: solid 0px;
		}
		.no-border-right
		{
			border-right: solid 0px;
		}

		/*
		table tr:last-child td:last-child
		{
			border-color: #424242;
		}
		*/
	</style>
</head>
<body>
	<div class="container">
		<header>
			<h1>Maxime De Courchelle</h1>
		</header>
		<section class="main">
			<h2>Skills</h2>
			<table>
				<tr>
					<th>Parcours</th>
					<th>Competences</th>
				</tr>
				<tr>
					<td>Ecole des lezards</td>
					<td class="no-border-bottom">Tirage de langue éclaire</td>
				</tr>
				<tr>
					<td class="no-border-right">Institut du Camouflage</td>
					<td style="border-color:#424242">Deplacememnt sur les plafons</td>
				</tr>
			</table>
			<h2>Loisirs</h2>
			<ul>
			  <li>courrir apres les insectes</li>
			  <li>rentrer dans les maisons</li>
			</ul>
			<h2>Autres</h2>
			<ol>
			  <li>Tourner les yeux</li>
			  <li>Mes ancetres sont les dinos</li>
			</ol>
		</section>
		<footer></footer>
	</div>
</body>
