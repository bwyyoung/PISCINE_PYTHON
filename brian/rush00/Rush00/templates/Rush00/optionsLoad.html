{% extends "Rush00/layout.html" %}

{% block content %}
	<div class="game_area-gameview-screen" id="options">
		<center><span class="read_text">LOAD GAME</span>
			<br /><br />
			<span class="read_text">Select SAVE SLOT to LOAD</span><br />
			{% for key, value in data_player %}
				<p class= "{% if name == key %} test {% endif %}">
					<span class="read_text">
					{{ key }}.pickle | {{value}} /
						{% for key2, value in data_monster %}
							{% if key == key2 %} {{value}} {% endif %}
						{% endfor %}
					</span>
				</p>
			{% endfor %}
		</center>
	</div>
{% endblock %}
