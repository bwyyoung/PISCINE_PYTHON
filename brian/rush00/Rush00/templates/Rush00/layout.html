<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>(Python)Moviemon</title>
	{% include 'Rush00/css/master_styles.html' %}
</head>
<body>
{% load static %}
<div class="game_area">
	<div class="row">
		<header id="header">
			<div class="game_area-logo">
			</div>
		</header>
		<div class="game_area-gameview">
			<div class="game_area2">
				<div class="row2">
					<div class="game_area-gameview-screen">

						{% block content %}
							<h2>Gameplay Contents</h2>
						{% endblock %}

					</div>

				</div>
			</div>
			<div class="control_area">
				<div class="d_pad">

					<a href="?a=up"> <div id="btn_up" class="left">UP</div></a>
					<a href="?a=down"> <div id="btn_down" class="left">DOWN</div></a>
					<a href="?a=right{% if index %}&index={{index}}{% endif %}">
						<div id="btn_right" class="left">RIGHT</div></a>
					<a href="?a=left"> <div id="btn_left" class="left">LEFT</div></a>
				</div>
				<div class="buttons_a_b">
					<a href="?a=a"> <div id="btn_a">BTN_A</div></a>
					<a href="?a=b"> <div id="btn_b">BTN_B</div></a>
				</div>

			</div>
			<div class="control_area-lower">
				<div class="control_btn_select">
					<a href="?a=select">SELECT</a>
				</div>
				<div class="control_btn_start">
					<a href="?a=start">START</a>
				</div>

			</div>
		</div>
	</div>
</div>
</body>
</html>
