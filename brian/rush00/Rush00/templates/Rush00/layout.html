<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>(Python)Moviemon</title>
	{% include 'Rush00/css/master_styles.html' %}
</head>
<body>
{% load static %}
<div class="game_area">
	<div class="row">
		<header id="header">
			<div class="game_area-logo">
			</div>
		</header>
		<div class="game_area-gameview">
			<div class="game_area2">
				<div class="row2">
					<div class="game_area-gameview-screen">

						{% block content %}
							<h2>Gameplay Contents</h2>
						{% endblock %}
					</div>
				</div>
			</div>
			<div class="control_area">

				<div class="d_pad">
					<div class="control">
						<a href="?a=up"> <div class="control" id="btn_up" >
							<span class="read_text">UP</span></div></a>
						<a href="?a=down"> <div class="control" id="btn_down" >
							<span class="read_text">DOWN</span></div></a>

						<div class="control" id="btn_right" >
							<a href="?a=right{% if index %}&index={{index}}{% endif %}">
								<span class="read_text">RIGHT</span>
							</a>
						</div>
						<a href="?a=left"> <div class="control" id="btn_left" >
							<span class="read_text">LEFT</span></div></a>
					</div>
				</div>
				<div class="buttons_a_b">
					<div class="control">

						<a href="?a=a"> <div class="control" id="btn_a">
							<span class="read_text">BTN_A</span></div></a>
						<a href="?a=b"> <div class="control"  id="btn_b">
							<span class="read_text">BTN_B
							</span></div></a>
					</div>
				</div>

			</div>
			<div class="control_area-lower">
					<div class="control_btn_select">
						<a href="?a=select">
							<span class="read_text">SELECT
							</span></a>
					</div>
					<div class="control_btn_start">
						<a href="?a=start">
							<span class="read_text">START</span></a>
					</div>
			</div>
		</div>
	</div>
</div>
</body>
</html>
