{% extends "Rush00/layout.html" %}

{% block content %}
	<div class="game_area-gameview-screen" id="options">
		<center><span class="read_text">SAVE GAME</span>
			<br /><br /><br />
			{% for key, value in data_player %}
				<p class= "{% if name == key %} test {% endif %}">
					{{ key }}.pickle | {{value}} /
					{% for key2, value2 in data_monster %}
						{% if key == key2 %} {{value2}} {% endif %}
					{% endfor %}
				</p>
			{% endfor %}
		</center>
	</div>
{% endblock %}
